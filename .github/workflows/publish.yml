name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/arm64
          target: ${{ matrix.target }}
          tags: |
            ghcr.io/xavidiaz/lms-${{ matrix.target }}:latest
            ghcr.io/xavidiaz/lms-${{ matrix.target }}:${{ github.sha }}
